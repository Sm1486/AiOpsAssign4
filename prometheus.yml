global:
  scrape_interval: 1s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: "node"
    scrape_interval: 1s
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: "image_captioner"
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:18000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
